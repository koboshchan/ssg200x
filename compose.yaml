services:
  app:
    build:
      context: .
    environment:
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set your Clerk publishable key}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set your Clerk secret key}
      APP_ORIGIN: ${APP_ORIGIN:?Set exact browser origin}
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB: pokerroom
      FX_STREAM_ENABLED: ${FX_STREAM_ENABLED:-false}
      FX_STREAM_ENV: ${FX_STREAM_ENV:-}
      OANDA_API_TOKEN: ${OANDA_API_TOKEN:-}
      OANDA_ACCOUNT_ID: ${OANDA_ACCOUNT_ID:-}
    networks: [default, backend]
    ports:
      - "127.0.0.1:${APP_PORT:-43891}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    stop_grace_period: 60s
    networks: [backend]
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      # Only an uninitialized replica set may be initiated. Other errors fail closed.
      test:
        - CMD
        - mongosh
        - --quiet
        - mongodb://127.0.0.1:27017/?directConnection=true
        - --eval
        - |
          try {
            rs.status();
          } catch (error) {
            if (error.codeName !== "NotYetInitialized") throw error;
            const result = rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
            if (result.ok !== 1) throw new Error("Replica set initialization failed: " + JSON.stringify(result));
          }
          const hello = db.adminCommand({hello: 1});
          if (hello.setName !== "rs0" || hello.isWritablePrimary !== true) {
            throw new Error("Waiting for writable rs0 primary");
          }
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
networks:
  backend:
    internal: true
