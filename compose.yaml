services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set your Clerk publishable key}
    environment:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set your Clerk secret key}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?Set host email}
      APP_ORIGIN: ${APP_ORIGIN:?Set exact browser origin}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: pokerroom
    ports:
      - "127.0.0.1:${APP_PORT:-43891}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
  mongo:
    image: mongo:8.0
    volumes:
      - room-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  room-data:
