<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TableTalk · end-to-end encrypted · fixture demo</title>
<style>
:root{--bg:#0e1013;--panel:#161a1f;--line:#262c34;--text:#e6e9ee;--mute:#8b94a1;--accent:#5b9cf5;--mine:#1d2f4a;--bad:#e5645a;--ok:#4cc38a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;border-inline:1px solid var(--line);background:var(--bg)}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
header .sub{color:var(--mute);font-size:12px}header .who{color:var(--mute);margin-left:auto}.dot{width:8px;height:8px;border-radius:50%;background:var(--bad)}.dot[data-on=true]{background:var(--ok)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:10px 8px;font:inherit;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.list{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;align-self:flex-start}
.msg.mine{align-self:flex-end;background:var(--mine);border-color:#2b4467}
.msg[data-status=failed]{border-color:var(--bad)}.msg[data-status=pending]{opacity:.65}
.msg p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;color:var(--mute);font-size:12px;justify-content:space-between}
.note{color:var(--mute);padding:12px 14px;margin:0}.warn{color:var(--bad);padding:8px 14px;margin:0}
.panel{padding:16px 14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom))}
textarea{flex:1;resize:none;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;min-width:0}
textarea:disabled{opacity:.6}textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#07121f;font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}.more{align-self:center;font-size:12px}
.ctx{border-top:1px solid var(--line);background:var(--panel)}.ctx summary{padding:9px 14px;color:var(--mute);cursor:pointer}
.picker{padding:0 14px 12px;display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.grp>span{width:78px;color:var(--mute);font-size:12px}
.grp button{padding:4px 10px;font-size:13px}.grp button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
.grp .ghost{background:none;color:var(--mute);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head><body><div id="app"></div><script src="bundle.js"></script></body></html>
